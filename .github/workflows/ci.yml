name: CI
on:
  pull_request:
    branches:
      - main
jobs:
  build-and-test:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - name: Restore Dependencies & Tools
        run: |
          dotnet restore
          dotnet tool restore
      - name: Build Solution
        run: dotnet build -c Release --no-restore
      - name: Run Tests & Coverage Report
        run: dotnet run scripts/test-coverage.cs -- -c Release --no-build --no-restore
      - name: Publish Coverage Summary
        run: cat TestResults/CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport/
          retention-days: 14
      - name: Validate Resume Artifacts
        run: dotnet run --project src/Resume.Cli/Resume.Cli.csproj -c Release --no-build -- validate
      - name: Generate Resume Artifacts
        run: dotnet run --project src/Resume.Cli/Resume.Cli.csproj -c Release --no-build -- generate --output ./artifacts
      - name: Upload Generated Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resume-artifacts
          path: ./artifacts/
          retention-days: 14
